<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TubeVault</title>
  <meta name="description" content="Selbstgehostetes Video-Vault & Streaming-System" />
  <meta name="theme-color" content="#11191e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TubeVault" />
  <!-- Symbole für alle Geräte, abgeleitet aus app-symbol.svg (scripts/symbole.py): ico für alte Browser, PNG für
       Safari und Android, SVG für moderne Browser, apple-touch-icon und Manifest für den Startbildschirm -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <script>
    // Telefone landen auf der eigenständigen Mobil-Ansicht (/m). Wer dort
    // "Volle Ansicht öffnen" wählt, bleibt hier, bis Tab oder App schließen;
    // "Handy-Ansicht" oben führt zurück. Merkmal, Abfrage und Zieladressen
    // stehen für den Code in src/lib/utils/mobileView.js und müssen hier
    // gleich lauten - die Weiterleitung läuft vor der App, darum inline.
    (function () {
      try {
        localStorage.removeItem('tv_volle_ansicht');   // früher dauerhaft gemerkt: wer so feststeckte, ist frei
        if (sessionStorage.getItem('tv_volle_ansicht')) return;
        if (!window.matchMedia('(pointer: coarse) and (max-width: 820px)').matches) return;
        var watch = location.pathname.match(/^\/watch\/([^/]+)/);
        if (watch) location.replace('/m/video/' + watch[1]);
        else if (location.pathname === '/') location.replace('/m/');
      } catch (e) { /* ohne Speicherzugriff: große Ansicht */ }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>

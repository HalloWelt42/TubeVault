# TubeVault Docker Compose v1.3.0
# © HalloWelt42 – Private Nutzung
#
# Backend: Port 8031
# Frontend: Port 8032
#
# Container sind 100% unabhängig voneinander.
# Gemeinsamer Projektordner, aber eigene Builds.

services:
  # ==========================================
  # BACKEND – FastAPI + pytubefix + FFmpeg
  # ==========================================
  tubevault-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tubevault-backend
    ports:
      - "8031:8031"
    volumes:
      # Basis: DB + temp auf NVMe
      - /mnt/data/tubevault/data:/app/data
      - ./config:/app/config
      # Metadaten auf NVMe (überlagern Basis-Mount)
      - /mnt/data/tubevault/thumbnails:/app/data/thumbnails
      - /mnt/data/tubevault/avatars:/app/data/avatars
      - /mnt/data/tubevault/metadata:/app/data/metadata
      - /mnt/data/tubevault/banners:/app/data/banners
      # Medien auf USB-Platte (30TB)
      - /mnt/tb26/tubevault/videos:/app/data/videos
      - /mnt/tb26/tubevault/audio:/app/data/audio
      - /mnt/tb26/tubevault/subtitles:/app/data/subtitles
      - /mnt/tb26/tubevault/exports:/app/data/exports
      # Sammlung alter Videos für "Eigene Videos" (wahlweise): ohne Angabe der
      # leere Ordner scan im Datenverzeichnis, mit TUBEVAULT_SCAN_SOURCE in der
      # .env z.B. eine externe Platte. Ohne Sammlung bleibt die Seite einfach leer.
      - ${TUBEVAULT_SCAN_SOURCE:-/mnt/data/tubevault/data/scan}:/app/data/scan
      # Eigene Musiksammlung (FLAC usw.) als zweite Quelle der Musik, nur lesend:
      # mit TUBEVAULT_MUSIC_SOURCE in der .env der Musikordner, sonst ein leerer Ordner.
      - ${TUBEVAULT_MUSIC_SOURCE:-/mnt/data/tubevault/data/musik}:/app/data/musik:ro
    environment:
      - PYTHONUNBUFFERED=1
      # Zeitzone für Tageszähler und das nächtliche Drip-Fenster. Zeitstempel in
      # der Datenbank bleiben davon unabhängig Weltzeit (UTC).
      - TZ=${TZ:-Europe/Berlin}
      - TUBEVAULT_DATA_DIR=/app/data
      - TUBEVAULT_CONFIG_DIR=/app/config
      - MAX_CONCURRENT_DOWNLOADS=1
      - DEFAULT_QUALITY=720p
      # Abrufe bei der Quelle über IPv6: die IPv4-Adresse des Anschlusses wird
      # für Untertitel abgewiesen (429), über IPv6 kommt derselbe Abruf durch.
      # 6 = IPv6, 4 = IPv4, leer = das Betriebssystem entscheidet.
      - TUBEVAULT_SOURCE_IP=${TUBEVAULT_SOURCE_IP:-6}
    restart: unless-stopped
    # Grenze offener Dateien/Verbindungen deutlich über dem Standard (1024)
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8031/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - tubevault-net
    # Pi 5 Optimierungen
    deploy:
      resources:
        limits:
          memory: 2G

  # ==========================================
  # FRONTEND – Svelte 5 + Nginx
  # ==========================================
  tubevault-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tubevault-frontend
    ports:
      - "8032:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - tubevault-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ==========================================
  # PO-TOKEN PROVIDER (bgutil) – YouTube Bot-Umgehung
  # Liefert PO-Tokens via HTTP, wird von yt-dlp per Plugin abgefragt.
  # https://github.com/Brainicism/bgutil-ytdlp-pot-provider
  # ==========================================
  tubevault-pot:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    container_name: tubevault-pot
    restart: unless-stopped
    # Kein externer Port – nur intern erreichbar über tubevault-net
    expose:
      - "4416"
    networks:
      - tubevault-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ==========================================
  # NACHVERTONER – holt Vertonungen und KI-Transkripte ab und gibt sie an
  # die Vertonung und die Transkription (eigenes Programm, nachvertoner/README.md)
  # ==========================================
  tubevault-nachvertoner:
    build:
      context: ./nachvertoner
    container_name: tubevault-nachvertoner
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      - tubevault-backend
    environment:
      NACHVERTONER_TUBEVAULT: http://tubevault-backend:8031
      NACHVERTONER_SCHLUESSEL_DATEI: /geheim/schluessel
      NACHVERTONER_CA_DATEI: /zertifikate/rootCA.pem
      NACHVERTONER_ARBEIT: /arbeit
    # weitere Angaben (Adressen, Vorgabestimme) wahlweise in nachvertoner/.env, nur auf dem Pi
    env_file:
      - path: ./nachvertoner/.env
        required: false
    volumes:
      # App-Schlüssel des Zugangs "Nachvertoner" der Kellerwolke (Datei, 600) und die Hausstelle der Vertonung
      - ${NACHVERTONER_SCHLUESSEL:-/home/pi/.nachvertoner_schluessel}:/geheim/schluessel:ro
      - ${NACHVERTONER_CA:-/mnt/data/vertonung/zertifikate/rootCA.pem}:/zertifikate/rootCA.pem:ro
      # Arbeitsdateien (Video und Ton eines Auftrags, danach wieder weg)
      - /mnt/data/tubevault/nachvertoner:/arbeit
      - /etc/localtime:/etc/localtime:ro
      # ffmpeg und ffprobe vom Pi, nur lesend
      - /usr/bin/ffmpeg:/host/usr/bin/ffmpeg:ro
      - /usr/bin/ffprobe:/host/usr/bin/ffprobe:ro
      - /usr/lib/aarch64-linux-gnu:/host/usr/lib/aarch64-linux-gnu:ro
    networks:
      - tubevault-net
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  tubevault-net:
    name: tubevault-net
    driver: bridge
    # IPv6 für den Weg zur Quelle (siehe TUBEVAULT_SOURCE_IP); Docker vergibt
    # ein lokales IPv6-Netz und leitet über die IPv6-Adresse des Pi nach außen.
    enable_ipv6: true
